apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    chart: prometheus
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 28.9.1
    values:
      server:
        serverFiles:
          prometheus.yaml:
            scrape_configs:
            - job_name: 'surfreporter'
              static_configs:
              - targets: ['surfreporter-svc.surfreporter:8000']
              scrape_interval: 30s
              scrape_timeout: 10s
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
